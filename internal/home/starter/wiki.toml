spec = "0.1"

# Entry kinds (AGENTS.md): `spec` (product/), `task` (backlog/), `epic` (backlog/epics/), `note` (inbox/, research/, anything else)
types = ["spec", "task", "epic", "note"]

# Files that are not wiki entries (globs supported): the HQ's operating docs
ignore = ["AGENTS.md", "README.md"]

# Entries nothing has to link to: tasks, and contributions waiting for the lead
ignore_orphans = ["backlog/**", "inbox/**"]

# Scheduled tasks, one lane per priority (`quick`: no uncertainty, doable right now).
[[tool.wikiview.board]]
id      = "board"
path    = "/backlog"
name    = "Board"
where   = ["type=task", "status!=backlog"]
status  = "status"
columns = ["todo", "blocked", "in-progress", "done"]
lane    = "priority"
lanes   = ["quick", "high", "medium", "low"]

# Unscheduled tasks, and the scheduled ones not started yet. Moving one to `todo`
# schedules it: it stays here under To do, and shows on the board above too.
# Any status of work started or ended stays off it, the usual names included
# in case one is used instead of ours.
[[tool.wikiview.board]]
id      = "backlog"
path    = "/backlog"
name    = "Backlog"
where   = [
  "type=task",
  "status!=blocked", "status!=in-progress", "status!=done",
  "status!=doing", "status!=wip", "status!=review", "status!=in-review",
  "status!=testing", "status!=closed", "status!=cancelled", "status!=canceled",
  "status!=wontfix", "status!=archived",
]
status  = "status"
columns = ["backlog", "todo"]
lane    = "priority"
lanes   = ["quick", "high", "medium", "low"]

[[tool.wikiview.board]]
id      = "epics"
path    = "/backlog/epics"
name    = "Epics"
where   = ["type=epic"]
status  = "status"
columns = ["todo", "in-progress", "done"]

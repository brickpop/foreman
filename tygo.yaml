# Generates the UI's TypeScript types from the Go structs, the single source of
# truth for API and event shapes (wiki/product/architecture/tech-stack.md#wire-formats).
# Run `just types`; the output is committed.
packages:
  - path: github.com/brickpop/foreman/internal/workspace
    output_path: ui/src/api/types/workspace.ts
    include_files: [config.go, load.go]
  - path: github.com/brickpop/foreman/internal/events
    output_path: ui/src/api/types/events.ts
    include_files: [event.go]
  - path: github.com/brickpop/foreman/internal/store
    output_path: ui/src/api/types/store.ts
    include_files: [types.go]
    type_mappings:
      time.Time: "string /* RFC 3339 */"
  - path: github.com/brickpop/foreman/internal/harness
    output_path: ui/src/api/types/harness.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/wiki
    output_path: ui/src/api/types/wiki.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/runner
    output_path: ui/src/api/types/runner.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/forge
    output_path: ui/src/api/types/forge.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/messaging
    output_path: ui/src/api/types/messaging.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/setup
    output_path: ui/src/api/types/setup.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/git
    output_path: ui/src/api/types/git.ts
    include_files: [types.go]
    type_mappings:
      time.Time: "string /* RFC 3339 */"
  - path: github.com/brickpop/foreman/internal/repos
    output_path: ui/src/api/types/repos.ts
    include_files: [types.go]
    type_mappings:
      git.Commit: "git.Commit"
    frontmatter: |
      import type * as git from "./git";
  - path: github.com/brickpop/foreman/internal/profiles
    output_path: ui/src/api/types/profiles.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/userdata
    output_path: ui/src/api/types/userdata.ts
    include_files: [types.go]
  - path: github.com/brickpop/foreman/internal/cos
    output_path: ui/src/api/types/cos.ts
    include_files: [types.go]
    type_mappings:
      workspace.TeamConfig: "workspace.TeamConfig"
    frontmatter: |
      import type * as workspace from "./workspace";

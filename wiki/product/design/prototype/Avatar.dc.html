<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:{{ px }};height:{{ px }};flex-shrink:0;display:inline-block;">
  <svg viewBox="0 0 32 32" width="100%" height="100%" style="display:block;border-radius:{{ radius }};overflow:hidden;">
    <rect width="32" height="32" fill="{{ bg }}"></rect>
    <path d="M7 16 C7 5.5 25 5.5 25 16 L25.6 27 L6.4 27 Z" fill="{{ hc }}" style="display:{{ dHairLong }};"></path>
    <path d="M4.5 33 C4.5 25.6 27.5 25.6 27.5 33 Z" fill="rgba(20,20,20,0.28)"></path>
    <ellipse cx="16" cy="16.6" rx="7.4" ry="8.4" fill="{{ skin }}"></ellipse>
    <path d="M8.4 15.2 C7.6 6.8 24.4 6.8 23.6 15.2 C22.6 11.6 19.2 10.6 16 10.6 C12.8 10.6 9.4 11.6 8.4 15.2 Z" fill="{{ hc }}" style="display:{{ dHairTop }};"></path>
    <circle cx="16" cy="6.2" r="3" fill="{{ hc }}" style="display:{{ dBun }};"></circle>
    <g fill="{{ hc }}" style="display:{{ dCurly }};">
      <circle cx="9.6" cy="12.6" r="2.6"></circle><circle cx="12" cy="9.6" r="2.9"></circle><circle cx="16" cy="8.4" r="3.1"></circle><circle cx="20" cy="9.6" r="2.9"></circle><circle cx="22.4" cy="12.6" r="2.6"></circle>
    </g>
    <path d="M8.7 17.5 C9.2 24.5 12.8 26.6 16 26.6 C19.2 26.6 22.8 24.5 23.3 17.5 C22.2 21.6 19.6 23.2 16 23.2 C12.4 23.2 9.8 21.6 8.7 17.5 Z" fill="{{ hc }}" style="display:{{ dBeardFull }};"></path>
    <path d="M8.7 17.5 C9.2 24.5 12.8 26.6 16 26.6 C19.2 26.6 22.8 24.5 23.3 17.5 C22.2 21.6 19.6 23.2 16 23.2 C12.4 23.2 9.8 21.6 8.7 17.5 Z" fill="{{ hc }}" fill-opacity="0.32" style="display:{{ dStubble }};"></path>
    <g fill="#1A1A1A" style="display:{{ dEyesDots }};"><circle cx="13" cy="16.4" r="1.1"></circle><circle cx="19" cy="16.4" r="1.1"></circle></g>
    <g fill="rgba(255,255,255,0.18)" stroke="#1A1A1A" stroke-width="0.9" style="display:{{ dGlasses }};"><circle cx="13" cy="16.4" r="2.6"></circle><circle cx="19" cy="16.4" r="2.6"></circle><path d="M15.6 16.2 L16.4 16.2" fill="none"></path></g>
    <g fill="#1A1A1A" style="display:{{ dShades }};"><rect x="10.1" y="14.9" width="5.4" height="3" rx="1.3"></rect><rect x="16.5" y="14.9" width="5.4" height="3" rx="1.3"></rect><rect x="15.4" y="15.6" width="1.2" height="0.7"></rect></g>
    <g fill="none" stroke="#1A1A1A" stroke-width="0.9" stroke-linecap="round" style="display:{{ dSleepy }};"><path d="M11.7 16.5 Q13 17.4 14.3 16.5"></path><path d="M17.7 16.5 Q19 17.4 20.3 16.5"></path></g>
    <path d="M13.4 20.3 C14.6 19.2 15.6 19.7 16 20.1 C16.4 19.7 17.4 19.2 18.6 20.3 C17.4 21 16.6 20.7 16 20.5 C15.4 20.7 14.6 21 13.4 20.3 Z" fill="{{ hc }}" style="display:{{ dMust }};"></path>
    <path d="M14.3 21.4 Q16 22.7 17.7 21.4" fill="none" stroke="rgba(40,20,10,0.65)" stroke-width="0.9" stroke-linecap="round"></path>
  </svg>
  <span style="position:absolute;inset:0;border-radius:{{ radius }};box-shadow:{{ ring }};pointer-events:none;"></span>
  <span style="position:absolute;right:-3px;bottom:-3px;width:{{ dotPx }};height:{{ dotPx }};border-radius:50%;background:{{ dot }};box-shadow:0 0 0 2px {{ dotBorder }};display:{{ dDot }};"></span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:80,&quot;height&quot;:80},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;,&quot;min&quot;:16,&quot;max&quot;:128},&quot;color&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#6FA8DC&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;face&quot;:{&quot;editor&quot;:null,&quot;default&quot;:{&quot;skin&quot;:&quot;#E2AE85&quot;,&quot;hair&quot;:&quot;curly&quot;,&quot;hairColor&quot;:&quot;#6B4A2F&quot;,&quot;eyes&quot;:&quot;glasses&quot;,&quot;beard&quot;:&quot;stubble&quot;},&quot;tsType&quot;:&quot;{skin,hair,hairColor,eyes,beard}&quot;},&quot;dot&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;dotBorder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ring&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, f = p.face || {};
    const size = Number(p.size) || 32;
    const show = b => b ? 'inline' : 'none';
    const hair = f.hair || 'short', eyes = f.eyes || 'dots', beard = f.beard || 'none';
    return {
      px: size + 'px', radius: Math.round(size * 0.24) + 'px',
      bg: p.color || '#8E9AAF', skin: f.skin || '#E2AE85', hc: f.hairColor || '#2B2420',
      ring: p.ring ? 'inset 0 0 0 ' + Math.max(1.5, size / 15).toFixed(1) + 'px ' + p.ring : 'none',
      dHairLong: show(hair === 'long'), dHairTop: show(hair === 'short' || hair === 'long' || hair === 'bun'), dBun: show(hair === 'bun'), dCurly: show(hair === 'curly'),
      dEyesDots: show(eyes === 'dots' || eyes === 'glasses'), dGlasses: show(eyes === 'glasses'), dShades: show(eyes === 'shades'), dSleepy: show(eyes === 'sleepy'),
      dBeardFull: show(beard === 'full'), dStubble: show(beard === 'stubble'), dMust: show(beard === 'mustache'),
      dot: p.dot || 'transparent', dDot: p.dot ? 'block' : 'none', dotPx: Math.max(7, Math.round(size * 0.32)) + 'px', dotBorder: p.dotBorder || 'var(--bg)'
    };
  }
}
</script>
</body>
</html>
